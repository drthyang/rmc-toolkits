name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported interpreter with the declared dependency floors
          # (pyproject.toml) pinned exactly, so the floors stay honest.
          - python-version: "3.9"
            deps: oldest
          - python-version: "3.11"
            deps: latest
          - python-version: "3.13"
            deps: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pin the dependency floors
        if: matrix.deps == 'oldest'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.22.4" "scipy==1.8.1" "matplotlib==3.6.3" "contourpy==1.0.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_app/backend/requirements.txt
          pip install -e ".[test]"

      - name: Show resolved versions
        run: python -c "import sys, numpy, scipy, matplotlib; print(sys.version, numpy.__version__, scipy.__version__, matplotlib.__version__)"

      - name: Run tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web_app/frontend

      - name: Lint
        run: npx eslint src
        working-directory: web_app/frontend

      - name: Test
        run: npm test
        working-directory: web_app/frontend

      - name: Build
        run: npm run build
        working-directory: web_app/frontend
