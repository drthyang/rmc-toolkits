name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python package & backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_app/backend/requirements.txt
          pip install -e .

      - name: Run tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web_app/frontend

      - name: Lint
        run: npx eslint src
        working-directory: web_app/frontend

      - name: Build
        run: npm run build
        working-directory: web_app/frontend
