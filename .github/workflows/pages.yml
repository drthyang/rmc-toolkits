name: Deploy static dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web_app/frontend

      - name: Build static dashboard
        run: npm run build
        working-directory: web_app/frontend
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE_PATH: /rmc-toolkits/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_app/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
