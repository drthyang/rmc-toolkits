[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-toolkits"
version = "0.1.0"
description = "Post-processing utilities and a local-first dashboard for RMCProfile and STOG outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tsung-Han Yang" }]
keywords = ["RMCProfile", "STOG", "PDF", "EXAFS", "crystallography", "neutron", "x-ray", "KDE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
backend = ["flask", "flask-cors", "gunicorn"]

[project.urls]
Homepage = "https://github.com/drthyang/rmc-toolkits"
Dashboard = "https://drthyang.github.io/rmc-toolkits/"
Changelog = "https://github.com/drthyang/rmc-toolkits/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["rmc_toolkits"]
