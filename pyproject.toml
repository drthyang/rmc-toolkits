[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-toolkits"
version = "0.3.0"
description = "A browser-based dashboard and post-processing utilities for RMCProfile and STOG outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Tsung-Han Yang" }]
keywords = ["RMCProfile", "STOG", "PDF", "EXAFS", "crystallography", "neutron", "x-ray", "KDE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
backend = ["flask", "flask-cors", "gunicorn"]

[project.urls]
Homepage = "https://github.com/drthyang/rmc-toolkits"
Dashboard = "https://drthyang.github.io/rmc-toolkits/"
Changelog = "https://github.com/drthyang/rmc-toolkits/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["rmc_toolkits"]
