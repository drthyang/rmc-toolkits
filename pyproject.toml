[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-toolkits"
version = "0.6.0.dev0"
description = "A browser-based dashboard and post-processing utilities for RMCProfile and STOG outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Tsung-Han Yang" }]
keywords = ["RMCProfile", "STOG", "PDF", "EXAFS", "crystallography", "neutron", "x-ray", "KDE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# Floors are exercised by the "oldest" CI job (.github/workflows/tests.yml);
# contourpy is imported directly by kde.py, not only through matplotlib.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.6",
    "contourpy>=1.0.7",
]

[project.optional-dependencies]
backend = ["flask", "flask-cors", "gunicorn"]
test = ["tomli; python_version < '3.11'"]

[project.scripts]
rmc-autoscale = "rmc_toolkits.scaling_cli:main"
rmc-triplets = "rmc_toolkits.triplets_cli:main"

[project.urls]
Homepage = "https://github.com/drthyang/rmc-toolkits"
Dashboard = "https://drthyang.github.io/rmc-toolkits/"
Changelog = "https://github.com/drthyang/rmc-toolkits/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["rmc_toolkits"]
